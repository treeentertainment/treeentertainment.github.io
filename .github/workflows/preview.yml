name: Preview Hugo Site

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

concurrency:
  group: "pr-preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources/_gen
          key: ${{ runner.os }}-hugo-pr-${{ hashFiles('**/go.sum', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-hugo-pr-
            ${{ runner.os }}-hugo-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Install Dependencies
        run: npm ci

      - name: Generate hugo_stats.json
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --renderToMemory \
            --disableKinds=RSS,sitemap,robotsTXT

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          PREVIEW_URL="https://pr-${{ github.event.pull_request.number }}.treeentertainment.pages.dev"
          hugo \
            --gc \
            --minify \
            --baseURL "$PREVIEW_URL/"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact-pr-${{ github.event.pull_request.number }}
          path: ./public
          retention-days: 1

  deploy-preview:
    if: github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.treeentertainment.pages.dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-artifact-pr-${{ github.event.pull_request.number }}
          path: ./public

      - name: Deploy Previews to Cloudflare Pages
        id: cf_deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=treeentertainment --branch=pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Delete Cloudflare Pages Deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          echo "Fetching deployments for branch: $BRANCH_NAME..."
          DEPLOYMENTS_JSON=$(npx --yes wrangler@latest pages deployment list --project-name treeentertainment --json)
          IDS=$(echo "$DEPLOYMENTS_JSON" | jq -r ".[] | select(.Branch == \"$BRANCH_NAME\" or .Environment == \"preview\" and .Aliases != null and (.Aliases[] | contains(\"$BRANCH_NAME\"))) | .Id" | sort -u)

          if [ -z "$IDS" ]; then
            IDS=$(echo "$DEPLOYMENTS_JSON" | jq -r ".[] | select(.Branch == \"$BRANCH_NAME\" or .branch == \"$BRANCH_NAME\") | .Id // .id")
          fi

          if [ -z "$IDS" ]; then
            echo "No deployments found for branch $BRANCH_NAME. Nothing to clean up."
          else
            for ID in $IDS; do
              echo "Deleting deployment ID: $ID"
              npx --yes wrangler@latest pages deployment delete "$ID" --project-name treeentertainment --force
            done
          fi
