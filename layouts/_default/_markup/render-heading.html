{{ if and (eq .Level 2) (in .Page.Params.feature "toc") (not (.Page.Scratch.Get "toc_rendered")) }}
  {{ .Page.Scratch.Set "toc_rendered" true }}
  {{ if gt (len .Page.TableOfContents) 100 }}
    
    <style>
      details[open] summary ~ div {
        animation: slideDown 0.3s ease-out forwards;
      }
      
      .toc-fade-out summary ~ div {
        animation: slideUp 0.3s ease-in forwards;
      }

      @keyframes slideDown {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes slideUp {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
    </style>

    <details id="toc-container" class="group my-8 rounded-xl border border-slate-200 bg-slate-50/50 dark:border-slate-800 dark:bg-slate-900/50">
      <summary class="flex cursor-pointer list-none items-center gap-2 p-5 [&::-webkit-details-marker]:hidden">
        <svg class="h-5 w-5 text-slate-500 transition-transform duration-300 group-open:rotate-90 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
        <span class="font-bold text-slate-800 dark:text-slate-200">목차</span>
      </summary>
      
      <div class="px-5 pb-5 pt-0">
        <nav class="prose prose-slate dark:prose-invert max-w-none 
                    prose-ul:list-none prose-ul:pl-0 prose-li:my-1
                    prose-a:no-underline prose-a:text-slate-600 hover:prose-a:text-blue-600 dark:prose-a:text-slate-400 dark:hover:prose-a:text-blue-400
                    [&_ul_ul]:pl-4 [&_ul_ul]:border-l [&_ul_ul]:border-slate-200 dark:[&_ul_ul]:border-slate-700">
          {{ .Page.TableOfContents }}
        </nav>
      </div>
    </details>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const toc = document.getElementById('toc-container');
        if (toc) {
          const links = toc.querySelectorAll('a');
          links.forEach(function(link) {
            link.addEventListener('click', function(e) {
              toc.classList.add('toc-fade-out');
              
              setTimeout(function() {
                toc.removeAttribute('open');
                toc.classList.remove('toc-fade-out');
              }, 280);
            });
          });
        }
      });
    </script>
  {{ end }}
{{ end }}

<!-- prettier-ignore -->
 <h{{ .Level }} id="{{ .Anchor | safeURL }}" class="scroll-mt-20">{{ .Text | safeHTML }}</h{{ .Level }}>
