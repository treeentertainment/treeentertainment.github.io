{{ with .Page.Params.links }}
<div class="flex gap-4 overflow-x-auto my-4">
    {{ range . }}
    <div class="flex items-center gap-1 whitespace-nowrap flex-shrink-0">
        {{ if .link }}
        <a href="{{ .link }}" target="_blank" rel="noopener noreferrer"
            class="flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium transition-colors no-underline hover:no-underline">
            {{ if .icon }}<i class="{{ .icon }}"></i>{{ end }} {{ .name }}
        </a>
        {{ end }} {{ with .rawHtml }}
        <div>{{ . | safeHTML }}</div>
        {{ end }}
    </div>
    {{ end }}
</div>
{{ end }}
